## 依赖清单（ESP-IDF 6.0.x）
## esp_hosted / esp_wifi_remote 选 IDF>=6 的版本线（与微雪 wifistation 例程一致）。
## 注意：板载 C6 出厂固件来自 esp_hosted 1.4.x 线；若运行时 Wi-Fi 初始化报
## hosted 版本不匹配，需要先更新 C6 固件（见微雪 FAQ：C6_IO9 拉低 + C6 UART 烧录），
## 或改装 ESP-IDF 5.5 + esp_hosted 1.4.7 / esp_wifi_remote 0.14.5。
dependencies:
  idf: ">=6.0"

  # 开发板 BSP：屏幕 / 触摸 / 音频 codec(ES8311+ES7210) / SD 卡
  waveshare/esp32_p4_wifi6_touch_lcd_4_3: "^1.0.1"

  # 小智协议组件（WebSocket + Opus + MCP + OTA 配置端点）
  espressif/esp_xiaozhi: "^0.1.2"

  # Opus 编解码：2.6.x 起要求 P4 rev>=3.0（本板 rev1.3 会编译失败），锁 2.5.x
  espressif/esp_audio_codec: "~2.5.0"

  # ESP-Hosted：P4 通过 SDIO 使用板载 C6 的 Wi-Fi 6
  espressif/esp_hosted: ">=2.12,<3.0"
  espressif/esp_wifi_remote: ">=1.6,<2.0"
